name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Python backend ──────────────────────────────────────────────────────
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.14'

      - name: Install Python dependencies
        run: uv sync

      - name: Build backend with PyInstaller
        run: uv run pyinstaller backend.spec --distpath dist/backend --workpath C:\Temp\pyinstaller-work --noconfirm

      # ── Frontend ────────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # ── Electron — unpack only (we handle packaging ourselves) ──────────────
      - name: Package app (unpacked)
        working-directory: frontend
        run: >
          ./node_modules/.bin/electron-builder
          --win --dir
          --publish never
          "--config.directories.output=..\dist-win"

      # ── Icon conversion PNG → ICO (ImageMagick pre-installed on runner) ──────
      - name: Convert icon PNG to ICO
        run: magick frontend\public\icon.png -define icon:auto-resize="256,128,64,48,32,16" frontend\public\icon.ico

      # ── Read version from package.json ──────────────────────────────────────
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content frontend/package.json | ConvertFrom-Json).version
          echo "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"

      # ── Inno Setup installer ────────────────────────────────────────────────
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $ver  = "${{ steps.version.outputs.version }}"
          & $iscc /DAppVersion=$ver installer\matchbox.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      # ── Portable zip ────────────────────────────────────────────────────────
      - name: Build portable zip
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          Compress-Archive -Path "dist-win\win-unpacked\*" `
                           -DestinationPath "dist-win\Matchbox-$ver-portable-win.zip"

      # ── Upload to GitHub Release ────────────────────────────────────────────
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist-win/Matchbox-Setup-*.exe
            dist-win/Matchbox-*-portable-win.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Always upload as artifact (workflow_dispatch & PRs) ─────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Matchbox-Windows-${{ steps.version.outputs.version }}
          path: |
            dist-win/Matchbox-Setup-*.exe
            dist-win/Matchbox-*-portable-win.zip
          retention-days: 14
